version: '3.3'

networks:
  backend:
    ipam:
      config:
        - subnet: 172.18.1.0/24
        
volumes:
  mongodbdata:
    driver: local

services:
  flaskapi:
    build:
      context: flaskAPI
      dockerfile: ./development.Dockerfile
    container_name: flaskapi
    environment:
      FLASK_APP: run.py
      FLASK_ENV: development
      FLASK_DEBUG: 1
      MONGODB_CONNECTION_STRING: $MONGODB_CONNECTION_STRING$
      PAYPAL_API_URL: $PAYPAL_API_URL$
      PAYPAL_CLIENT_ID: $PAYPAL_CLIENT_ID$
      PAYPAL_SECRET: $PAYPAL_SECRET$
      ODDS_API_KEY: $ODDS_API_KEY$
      SECRET_KEY: $SECRET_KEY$
      CLIENT_DOMAIN: $CLIENT_DOMAIN$
      DOMAIN: $DOMAIN$
      GMAIL_USER: $GMAIL_USER$
      GMAIL_PASSWORD: $PASSWORD$
      PORT: $PORT$
    networks:
      backend:
        ipv4_address: $
    ports:
      - 8000:8000
      - 5678:5678
    entrypoint: [ "python", "-m", "debugpy", "--listen", "0.0.0.0:5678", "-m", "run",  "--wait-for-client", "--multiprocess", "-m", "flask", "run", "-h", "0.0.0.0", "-p", "8000" ]
    expose:
      - 8000
    volumes:
      - ./flaskAPI:/flask

  mongodb:
    image: mongo
    container_name: 'mongodb'
    environment:
      MONGO_INITDB_ROOT_USERNAME: $
      MONGO_INITDB_ROOT_PASSWORD: $
      MONGO_INITDB_DATABASE: $
      MONGODB_DATA_DIR: $
      MONGODB_LOG_DIR: $
    networks:
      backend:
        ipv4_address: $
    volumes:
      - mongodbdata:/data/db
    ports: 
      - 27017:27017
