version: '3.3'

networks:
  backend:
    ipam:
      config:
        - subnet: 172.18.1.0/24
        
volumes:
  mongodbdata:
    driver: local

services:
  flaskapi:
    build:
      context: flaskAPI
      dockerfile: ./development.Dockerfile
    container_name: flaskapi
    environment:
      FLASK_APP: run.py
      FLASK_ENV: development
      FLASK_DEBUG: 1
      MONGODB_CONNECTION_STRING: mongodb+srv://bet-royale-admin:Fe5BWjLwSiSP4byu@production-cluster.okz6gg9.mongodb.net/
      PAYPAL_API_URL: https://api-m.sandbox.paypal.com
      PAYPAL_API_TOKEN: A21AAKQgB3cjjBNhgnGpG3l4lAuYf_7fgnP1J9ms-ZgMlAQrHdFr4tO2-ap0W73wOcwCSLM8QaqrPLUvJrdNsfyJ_r4r3rxIQ
      ODDS_API_KEY: 87c963d43e0c21a33f7d029816a95f77
      PORT: 8000
    networks:
      backend:
        ipv4_address: 172.18.1.4
    ports:
      - 8000:8000
