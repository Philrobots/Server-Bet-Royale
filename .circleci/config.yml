version: 2
jobs:
  build:
    docker:
      - image: circleci/python:3.9
    steps:
      - checkout
      - run:
          name: Upgrade pip
          command: sudo python3 -m pip install --upgrade pip
      - run: 
          name: Install pip requirements
          command: sudo pip3 install -r flaskAPI/requirements.txt
      - run:
          name: Run unit tests
          command: python3 -m pytest flaskAPI/test --junitxml=python_tests/results.xml --cov=flaskAPI/main --cov-report html --cov-report xml
      # - run:
      #     name: Send Coverage to DeepCov
      #     command: |
      #       curl https://deepsource.io/cli | sh
      #       ./bin/deepsource report --analyzer test-coverage --key python --value-file ./coverage.xml
      - store_test_results:
          path: python_tests
      - store_artifacts:
          path: htmlcov
  deploy-test:
    machine: true
    steps:
      - checkout
      - run:
          name: Start API and check it is running
          command: |
            docker build flaskAPI -t flaskapi -f flaskAPI/development.Dockerfile
            docker run -e PORT=8000 -d --name flaskapi flaskapi
            docker exec flaskapi curl --retry 5 --fail --retry-connrefused http://127.0.0.1:8000/ping
workflows:
  version: 2
  build-and-deploy:
    jobs:
      - build
      - deploy-test:
          requires:
            - build